<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 430" width="1170" height="430" font-family="Segoe UI, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
  </defs>
  <rect width="1170" height="430" fill="#FFFFFF"/>

  <text x="585" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Data Lake Analytics sur Azure : architecture Medallion</text>

  <!-- Boîtes -->
  <g stroke-width="2">
    <rect x="30"  y="90" width="150" height="120" rx="10" fill="#E8F0FB" stroke="#4A78B5"/>
    <rect x="270" y="90" width="150" height="120" rx="10" fill="#F6E3CF" stroke="#B87333"/>
    <rect x="510" y="90" width="150" height="120" rx="10" fill="#E6EAF0" stroke="#8A96A6"/>
    <rect x="750" y="90" width="150" height="120" rx="10" fill="#FFF0B8" stroke="#C9A227"/>
    <rect x="990" y="90" width="150" height="120" rx="10" fill="#E8F0FB" stroke="#4A78B5"/>
  </g>

  <g text-anchor="middle" fill="#111827">
    <text x="105" y="130" font-size="13" font-weight="700" fill="#4A78B5">SOURCE</text>
    <text x="105" y="158" font-size="16" font-weight="600">Blob Storage</text>
    <text x="105" y="182" font-size="13" fill="#4B5563">15 fichiers CSV</text>

    <text x="345" y="130" font-size="13" font-weight="700" fill="#B87333">BRONZE</text>
    <text x="345" y="158" font-size="16" font-weight="600">raw</text>
    <text x="345" y="182" font-size="13" fill="#4B5563">CSV bruts</text>

    <text x="585" y="130" font-size="13" font-weight="700" fill="#6B7280">SILVER</text>
    <text x="585" y="158" font-size="16" font-weight="600">curated</text>
    <text x="585" y="182" font-size="13" fill="#4B5563">Parquet nettoyé</text>

    <text x="825" y="130" font-size="13" font-weight="700" fill="#A8861C">GOLD</text>
    <text x="825" y="158" font-size="16" font-weight="600">enriched</text>
    <text x="825" y="182" font-size="13" fill="#4B5563">Dimensions et faits</text>

    <text x="1065" y="130" font-size="13" font-weight="700" fill="#4A78B5">RESTITUTION</text>
    <text x="1065" y="158" font-size="16" font-weight="600">Power BI</text>
    <text x="1065" y="182" font-size="13" fill="#4B5563">Tableaux de bord</text>
  </g>

  <!-- Flèches -->
  <g stroke="#4B5563" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="182" y1="150" x2="266" y2="150"/>
    <line x1="422" y1="150" x2="506" y2="150"/>
    <line x1="662" y1="150" x2="746" y2="150"/>
    <line x1="902" y1="150" x2="986" y2="150"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#374151" font-weight="600">
    <text x="224" y="138">Data Factory</text>
    <text x="464" y="138">Spark</text>
    <text x="704" y="138">Spark</text>
    <text x="944" y="138">Vues SQL</text>
  </g>

  <!-- Bandeaux -->
  <g>
    <rect x="30" y="250" width="1110" height="46" rx="8" fill="#F3F4F6" stroke="#D1D5DB"/>
    <rect x="30" y="306" width="1110" height="46" rx="8" fill="#F3F4F6" stroke="#D1D5DB"/>
    <rect x="30" y="362" width="1110" height="46" rx="8" fill="#F3F4F6" stroke="#D1D5DB"/>
  </g>
  <g font-size="14" fill="#111827">
    <text x="50" y="278"><tspan font-weight="700">Orchestration</tspan><tspan fill="#4B5563">  :  Azure Data Factory, pipeline PL_Orchestration lancé par un trigger planifié</tspan></text>
    <text x="50" y="334"><tspan font-weight="700">Supervision</tspan><tspan fill="#4B5563">  :  Azure Monitor, alerte e-mail en cas d'échec de pipeline</tspan></text>
    <text x="50" y="390"><tspan font-weight="700">Infrastructure</tspan><tspan fill="#4B5563">  :  Terraform, ressources Azure et rôles RBAC, versionnés sur GitHub</tspan></text>
  </g>
</svg>
